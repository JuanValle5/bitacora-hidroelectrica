spring:
  application:
    name: bitacora-hidroelectrica
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitacora_db}
    username: ${SPRING_DATASOURCE_USERNAME:bitacora_user}
    password: ${SPRING_DATASOURCE_PASSWORD:bitacora_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 28800000 # 8 horas
